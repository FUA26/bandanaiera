version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bandanaiera-postgres-infra
    restart: unless-stopped
    ports:
      - "8943:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-naiera_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bandanaiera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bandanaiera-redis-infra
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "8937:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - bandanaiera-network

  minio:
    image: minio/minio:latest
    container_name: bandanaiera-minio-infra
    command: server /data --console-address ":9001"
    ports:
      - "8900:9000"
      - "8901:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_DEFAULT_BUCKETS=${MINIO_BUCKET:-naiera-uploads-dev}
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    networks:
      - bandanaiera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  bandanaiera-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  minio-config:
